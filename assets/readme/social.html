<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Golos;src:url(../../app/src/main/res/font/golos_regular.ttf)}
@font-face{font-family:Golos;font-weight:600;src:url(../../app/src/main/res/font/golos_semibold.ttf)}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:640px;background:#F5F6FA;color:#1B1D2B;font-family:Golos;display:flex;align-items:center;gap:64px;padding:0 80px}
.left{flex:1}
.icon{width:120px;height:120px;border-radius:28px;background:#3949AB;display:grid;place-items:center;margin-bottom:40px}
h1{font-size:76px;font-weight:600;letter-spacing:-1.5px;line-height:1}
.sub{font-size:24px;color:#5D6178;margin-top:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
p{font-size:32px;line-height:1.35;margin-top:32px;color:#1B1D2B;max-width:560px}
.cap{width:500px;background:#1B1D2B;border-radius:24px;padding:36px 40px;color:#fff;font-size:28px;line-height:1.4}
.who{color:#A9B3FF;font-weight:600;font-size:22px;margin-top:22px}.who:first-child{margin-top:0}
.t{color:#8A8FA8;font-weight:400}
</style></head><body>
<div class="left">
  <div class="icon"><svg width="84" height="84" viewBox="26 30 56 52"><path fill="#fff" fill-rule="evenodd" d="M38,34 H70 A8,8 0 0 1 78,42 V60 A8,8 0 0 1 70,68 H48 L38,78 V68 A8,8 0 0 1 30,60 V42 A8,8 0 0 1 38,34 Z M40,44 H68 A2,2 0 0 1 68,48 H40 A2,2 0 0 1 40,44 Z M40,54 H58 A2,2 0 0 1 58,58 H40 A2,2 0 0 1 40,54 Z"/></svg></div>
  <h1>Meet Captions</h1>
  <div class="sub">for Android</div>
  <p>Google Meet live captions saved as text, with speaker names and times. Any language, no organizer rights, no audio.</p>
</div>
<div class="cap">
  <div class="who">Anna <span class="t">10:02:14</span></div><div>Let's start with last week's numbers.</div>
  <div class="who">Bob <span class="t">10:02:21</span></div><div>Sure, I've got the report open.</div>
  <div class="who">You <span class="t">10:02:30</span></div><div>Great, go ahead.</div>
</div>
</body></html>
